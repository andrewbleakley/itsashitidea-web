  /* ---- Edit the colours here ----
     Background alternatives: #FFB8C6 bubblegum, #9FE3CF mint, #A9D8FF sky */
  :root {
    --bg: #FFDB6E;
    --ink: #2A1810;
    --s: 1; /* scale, set by the script below */
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #E9E6E1;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  /* The post itself: always laid out at Instagram's 1080 × 1350 */
  .post {
    flex: none;
    width: 1080px;
    height: 1350px;
    padding: 88px 80px 72px;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    overflow: hidden;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(var(--s));
    transform-origin: center;
    box-shadow: 0 2px 24px rgba(42, 24, 16, 0.12);
  }

  .headline {
    margin: 0;
    font-size: 112px;
    font-weight: 800;
    line-height: 0.98;
    letter-spacing: -0.03em;
  }

  .tag {
    display: inline-block;
    margin-top: 14px;
    padding: 4px 26px 14px;
    border-radius: 22px;
    background: var(--ink);
    color: var(--bg);
    transform: rotate(-2deg);
  }

  .bulb {
    display: block;
    flex: none;
    width: 640px;
    height: 640px;
    margin: -10px 0 -20px;
  }

  .footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .subline {
    margin: 0;
    max-width: 820px;
    font-size: 46px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.01em;
  }

  .wordmark {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.02em;
  }

  /* ?export : exact 1080 × 1350, no scaling or backdrop (for screenshots) */
  .export body { background: var(--bg); }
  .export .stage { position: static; overflow: visible; }
  .export .post { position: static; transform: none; box-shadow: none; }
</style>
<script>
  // Scale the 1080 × 1350 post to fit the window. Add ?export to the URL for exact size.
  (function () {
    var exportMode = /[?&]export\b/.test(location.search);
    if (exportMode) document.documentElement.classList.add("export");

    function fit() {
      if (exportMode) return;
      var margin = 32;
      var s = Math.min(
        (window.innerWidth - margin) / 1080,
        (window.innerHeight - margin) / 1350,
        1
      );
      document.documentElement.style.setProperty("--s", Math.max(s, 0.1).toFixed(4));
    }

    window.addEventListener("resize", fit);
    document.addEventListener("DOMContentLoaded", fit);
    fit();
  })();
</script>
