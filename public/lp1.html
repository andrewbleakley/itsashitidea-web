<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nominate a Shit Idea</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFD600;
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      text-align: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 20px;
    }
    .logo img { width: 32px; height: 32px; }
    .icon {
      width: 120px;
      margin: 8px 0 24px;
    }
    h1 {
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .sub {
      font-size: 16px;
      opacity: 0.85;
      max-width: 400px;
      margin-bottom: 32px;
    }
    form {
      background: white;
      border-radius: 20px;
      padding: 28px 24px;
      width: 100%;
      max-width: 440px;
      text-align: left;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 15px;
      margin-bottom: 6px;
      margin-top: 18px;
    }
    label:first-child { margin-top: 0; }
    input, textarea {
      width: 100%;
      padding: 14px;
      border: 2px solid #eee;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #FFD600;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: #FFD600;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button:active { transform: scale(0.98); }
    .note {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="your-icon.png" alt="icon">
    It’s a Shit Idea
  </div>

  <img src="your-icon.png" class="icon" alt="Shit Idea icon">

  <h1>Nominate a Shit Idea</h1>
  <p class="sub">See a terrible idea about to launch? Do the world a favour.</p>

  <form>
    <label>Whose idea is this? 💩</label>
    <input type="text" placeholder="e.g. Elon Musk, Marketing Team, My Boss">

    <label>What is the idea? 💩</label>
    <input type="text" placeholder="e.g. A blockchain-powered toaster that tweets">

    <label>Why is it shit? (optional) 💩</label>
    <textarea placeholder="Spill the tea. Why shouldn’t this see the light of day?"></textarea>

    <button type="submit">Submit this disaster 💩</button>

    <p class="note">We read every submission. The internet thanks you.<br>(Terrible ideas only. No refunds on dignity.)</p>
  </form>
</body>
</html>
